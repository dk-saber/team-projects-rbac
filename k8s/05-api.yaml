apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: projecttrack-rbac
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: projecttrack-rbac
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Le seed (scripts/seed.js) est idempotent : il ne fait qu'insérer les
      # rôles/directions/départements manquants ($setOnInsert) et ne recrée un
      # compte Admin que s'il n'en existe aucun. Le relancer à chaque démarrage
      # de pod (y compris lors d'un scale-up) est donc sans danger.
      initContainers:
        - name: seed
          image: saberdk/projecttrack-rbac-api:latest
          command: ["node", "scripts/seed.js"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
      containers:
        - name: api
          image: saberdk/projecttrack-rbac-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
