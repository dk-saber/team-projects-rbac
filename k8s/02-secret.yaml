# ---------------------------------------------------------------------------
# SECRET TEMPLATE — replace every "change-me" value before applying this file,
# then NEVER commit the edited version with real secrets to Git.
#
# Preferred alternative to editing this file directly:
#
#   kubectl create secret generic api-secrets \
#     --namespace projecttrack-rbac \
#     --from-literal=JWT_SECRET='<a long random string>' \
#     --from-literal=REFRESH_TOKEN_SECRET='<a different long random string>' \
#     --from-literal=SEED_ADMIN_EMAIL='admin@example.com' \
#     --from-literal=SEED_ADMIN_PASSWORD='<a strong password>'
#
# Generate strong random secrets with, e.g.: openssl rand -base64 48
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: projecttrack-rbac
type: Opaque
stringData:
  JWT_SECRET: "change-me"
  REFRESH_TOKEN_SECRET: "change-me-too"
  # Optional — overrides the defaults baked into scripts/seed.js.
  SEED_ADMIN_EMAIL: "admin@example.com"
  SEED_ADMIN_PASSWORD: "ChangeMe123!"
