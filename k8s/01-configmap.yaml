apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: projecttrack-rbac
data:
  PORT: "5000"
  NODE_ENV: "production"

  # En cluster, restreignez idéalement à l'origine publique réelle du frontend
  # plutôt que "*" (voir README.md — ce "*" était toléré en local car tout le
  # trafic navigateur transite par le service "web", jamais directement par "api").
  CORS_ORIGIN: "*"

  MONGO_URI: "mongodb://mongo:27017/jwt-refresh-demo"

  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_TTL_SEC: "604800"

  FRONTEND_URL: "http://localhost:3000"
  PASSWORD_RESET_TTL_SEC: "900"

  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  MAIL_FROM: "no-reply@example.com"

  # Rôle assigné automatiquement à l'inscription publique (voir routes/auth.js)
  DEFAULT_REGISTRATION_ROLE: "Dev"
