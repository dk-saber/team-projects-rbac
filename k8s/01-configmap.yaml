apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: projecttrack-rbac
data:
  PORT: "5000"
  NODE_ENV: "production"

# In cluster mode, ideally restrict to the actual public origin of the frontend
# rather than "*" (see README.md — this "*" was tolerated locally because all
# browser traffic goes through the "web" service, never directly through the "api").
  CORS_ORIGIN: "*"

  MONGO_URI: "mongodb://mongo:27017/projecttrack"

  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_TTL_SEC: "604800"

  FRONTEND_URL: "http://localhost:3000"
  PASSWORD_RESET_TTL_SEC: "900"

  CLIENT_URL: "https://1f9596b580fe-10-244-5-77-3000.spch.r.killercoda.com"
  NUXT_PUBLIC_API_URL: "https://1f9596b580fe-10-244-5-77-3000.spch.r.killercoda.com/api"

  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  MAIL_FROM: "no-reply@example.com"

# Role automatically assigned upon public registration (see routes/auth.js)
  DEFAULT_REGISTRATION_ROLE: "Dev"
